name: fpga

on:
  push:
  workflow_dispatch:

jobs:
  fpga:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v3

      - name: Wrap nextpnr-ice40 with --ignore-loops
        run: |
          BIN_PATH=$(which nextpnr-ice40)
          mv "$BIN_PATH" "${BIN_PATH}.real"
          printf '#!/bin/sh\nexec "%s.real" --ignore-loops "$@"\n' "$BIN_PATH" > "$BIN_PATH"
          chmod +x "$BIN_PATH"

      - name: FPGA bitstream for ChipDiscover FPGA dev board
        uses: chipfoundry/tt-gds-action/fpga/ice40up5k@main
